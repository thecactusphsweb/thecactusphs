<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Cactus – Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script defer src="/assets/js/site.js"></script>
</head>
<body data-page="home" data-nav="home">
  <div id="header-mount"></div>

  <main class="site-main container">
    <section class="section home-hero">
      <div class="section-header">
        <h2>Latest from The Cactus</h2>
        <p>The newest stories from the current issue.</p>
      </div>

      <div class="hero-layout-3">
        <div id="hero-main"></div>
        <div id="hero-center" class="hero-center-column"></div>
        <aside id="hero-right" class="hero-right-column"></aside>
      </div>

      <div id="page-error" hidden></div>
    </section>
  </main>

  <div id="footer-mount"></div>
</body>
</html>
