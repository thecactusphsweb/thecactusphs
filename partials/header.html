<header class="site-header">
  <div class="container header-top">
    <div class="header-left">
      <div id="header-date" class="header-date"></div>
    </div>

    <a href="/" class="brand">
      <img class="brand-logo" src="/assets/img/cactus-logo.jpg" alt="The Cactus logo" />
      <span class="brand-name">The Cactus</span>
    </a>

    <form class="header-search" action="/archive/" method="GET">
      <input
        id="site-search-input"
        class="search-input"
        type="search"
        name="q"
        placeholder="Search articles…"
      />
      <button class="search-button" type="submit">Search</button>
    </form>
  </div>

  <div class="navbar">
    <div class="container nav-inner">
      <nav class="nav-links">
        <a href="/" data-nav="home">Home</a>
        <a href="/" data-nav="current">Current Issue</a>
        <a href="/archive/" data-nav="archive">Archive</a>
        <a href="/authors/" data-nav="authors">Authors</a>
        <a href="/about/" data-nav="about">About</a>
        <a href="/sponsors/" data-nav="sponsors">Sponsors</a>
      </nav>
    </div>
  </div>
</header>
