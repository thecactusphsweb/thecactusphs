<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Cactus – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body data-page="admin" data-nav="admin">
  <div id="header-mount"></div>
  <main class="site-main container admin-shell">
    <section id="login-card" class="admin-card" style="max-width:420px;margin:0 auto;">
      <h1>Admin Login</h1>
      <p class="muted" style="margin-bottom:1rem;">Enter the admin password to manage issues and articles.</p>
      <form id="login-form">
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Enter Admin</button>
      </form>
      <div id="login-status" class="admin-status" hidden></div>
    </section>

    <section id="admin-app" hidden>
      <div class="admin-header">
        <h1>The Cactus Admin</h1>
        <p class="muted">Create issues, publish articles, and set the current issue.</p>
        <div id="admin-status" class="admin-status">Loading…</div>
        <div style="margin-top:.75rem;">
          <button id="logout-button" class="admin-tab">Log out</button>
        </div>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="issues-tab">Create Issue</button>
        <button class="admin-tab" data-tab="articles-tab">Create Article</button>
        <button class="admin-tab" data-tab="current-tab">Current Issue</button>
      </div>

      <section id="issues-tab" class="admin-tab-panel active">
        <div class="admin-card">
          <h2>Create Issue</h2>
          <form id="issue-form">
            <label>Issue Title <input name="title" required></label>
            <label>Issue Slug <input name="slug" required></label>
            <label>Date Label <input name="dateLabel" placeholder="January 7, 2026" required></label>
            <label>Cover Image <input type="file" name="cover" accept="image/*" required></label>
            <label class="checkbox-row"><input type="checkbox" name="isCurrent"> Set as current issue</label>
            <button type="submit">Create Issue</button>
          </form>
        </div>
      </section>

      <section id="articles-tab" class="admin-tab-panel">
        <div class="admin-card">
          <h2>Create Article</h2>
          <form id="article-form">
            <label>Issue <select id="issue-select" name="issueSlug" required></select></label>
            <label>Title <input name="title" required></label>
            <label>Subtitle <input name="subtitle"></label>
            <label>Author <input name="author" required></label>
            <label>Date <input name="date" type="date" required></label>
            <label>Category <input name="category"></label>
            <label>Type
              <select name="type">
                <option>Long Article</option>
                <option>Interview</option>
                <option>Opinion</option>
                <option>Other</option>
              </select>
            </label>
            <label>Tags <input name="tags" placeholder="engineering, physics"></label>
            <label>Front Page Slot
              <select name="frontPageSlot">
                <option value="none">None</option>
                <option value="main">Main</option>
                <option value="center-lead">Center Lead</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
              </select>
            </label>
            <label>Hero Image <input type="file" name="hero" accept="image/*"></label>
            <label>Image Caption <input name="imageCaption"></label>
            <label>Body <textarea name="bodyText" rows="12" required></textarea></label>
            <label>Citations <textarea name="citationsText" rows="8"></textarea></label>
            <button type="submit">Create Article</button>
          </form>
        </div>
      </section>

      <section id="current-tab" class="admin-tab-panel">
        <div class="admin-card">
          <h2>Set Current Issue</h2>
          <form id="current-form">
            <label>Current Issue <select id="current-issue-select" name="currentSlug" required></select></label>
            <button type="submit">Update Current Issue</button>
          </form>
        </div>
      </section>
    </section>
  </main>
  <div id="footer-mount"></div>
  <script>window.__CACTUS_API_BASE__ = "https://api.YOUR-DOMAIN.com";</script>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
